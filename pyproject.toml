[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[project]
name = "plutil"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = ["prairielearn", "numpy==2.4.6"]

[project.urls]
Documentation = "https://plutil.readthedocs.io/"
Source = "https://github.com/SybelBlue/plutil"

[dependency-groups]
dev = [
    "chevron==0.14.0",
    "ipython",
    "lxml==6.1.3",
    "pl-vendor",
    "pyfakefs",
    "pyright",
    "pytest",
    "ruff",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.2.0",
]

[tool.uv]
package = true

[tool.uv.sources.prairielearn]
git = "https://github.com/PrairieLearn/PrairieLearn.git"
subdirectory = "apps/prairielearn/python"

[tool.pyright]
exclude = [".venv", "src/pl_big_operator_python"]
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
extend-exclude = ["src/pl_big_operator_python"]

[tool.pl-vendor]
schema-version = 4

[tool.pl-vendor.packages.pl-big-operator-python]
path = "src/pl_big_operator_python"
url = "https://github.com/SybelBlue/pl-big-operator-input.git"
branch = "release"
subdirectory = "vendor/pl_big_operator_python"

[tool.pytest.ini_options]
testpaths = ["src/plutil"]
addopts = ["--doctest-modules"]
