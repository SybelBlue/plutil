[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[project]
name = "plutil"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["prairielearn", "chevron==0.14.0", "lxml==6.1.3"]

[project.scripts]
plmagic-types = "plutil.__main__:main"

[dependency-groups]
dev = [
    "ipython",
    "pl-vendor",
    "pyfakefs",
    "pyright",
    "pytest",
    "ruff",
]

[tool.uv]
package = true

[tool.uv.sources.prairielearn]
git = "https://github.com/PrairieLearn/PrairieLearn.git"
subdirectory = "apps/prairielearn/python"

[tool.pyright]
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pl-vendor]
schema-version = 1
